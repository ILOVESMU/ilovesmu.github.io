      (() => {
        const colors = {
          ice: "#eef4fc",
          night: "#0b1220",
          gold: "#0d0b09",
          green: "#f4f8f2",
        };
        const choices = [...document.querySelectorAll("[data-theme-choice]")];
        const apply = (theme) => {
          document.documentElement.dataset.theme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", colors[theme] || colors.ice);
          try {
            localStorage.setItem("fpc.theme.v1", theme);
          } catch {}
          choices.forEach((button) => {
            button.setAttribute("aria-pressed", String(button.dataset.themeChoice === theme));
          });
        };
        choices.forEach((button) => {
          button.addEventListener("click", () => apply(button.dataset.themeChoice));
        });
        apply(document.documentElement.dataset.theme || "ice");
      })();
