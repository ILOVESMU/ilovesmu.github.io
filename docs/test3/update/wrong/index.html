,&quot;section&quot;:[0,&quot;程序性&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;婴儿先能抬头、再会坐爬站走，体现的发育规律是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;头尾发展律&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;近侧发展律&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;连续性&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;阶段性&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;头尾发展律指发育从头到脚，先抬头再坐爬站走；近侧发展律指靠近躯干的肌肉先发育、手指精细动作后发育。连续性讲过程不中断、不匀速，阶段性讲按年龄分成不同阶段。两律都属程序性，方向由遗传主导，不能与连续性、阶段性并列混淆。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年生长发育&quot;],&quot;page&quot;:[0,&quot;63&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;发育规律&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch01-c09&quot;],&quot;chapterKey&quot;:[0,&quot;ch01&quot;],&quot;chapter&quot;:[0,&quot;第一章 儿童少年生长发育&quot;],&quot;section&quot;:[0,&quot;指标体系&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;下列属于纵向测量指标的有：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;身高&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;坐高&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;上肢长&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;头围&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;足长&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;E&quot;]]],&quot;explanation&quot;:[0,&quot;纵向测量测的是长度和高度，身高、坐高、上肢长、下肢长、手长、足长都属这一类。头围属于横向测量里的围度，和胸围、上臂围同类，不属于纵向。记住“纵向量长度、横向量围度与宽度”，两类指标用途不同，不能互相替代。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年生长发育&quot;],&quot;page&quot;:[0,&quot;36&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;测量指标&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch01-c10&quot;],&quot;chapterKey&quot;:[0,&quot;ch01&quot;],&quot;chapter&quot;:[0,&quot;第一章 儿童少年生长发育&quot;],&quot;section&quot;:[0,&quot;一般规律&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;课件总结的生长发育一般规律包括：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;连续性&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;阶段性&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;程序性&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;不可逆性&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;]]],&quot;explanation&quot;:[0,&quot;三条规律是连续性、阶段性、程序性。不可逆性不在其中，而且与追赶性生长相矛盾——轨迹被疾病拽偏后，因素解除还能往原轨迹靠，说明过程可以被拉回。考试若问“哪条不是一般规律”，答案就是不可逆性这一类表述。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年生长发育&quot;],&quot;page&quot;:[0,&quot;48-66&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;一般规律&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch01-c11&quot;],&quot;chapterKey&quot;:[0,&quot;ch01&quot;],&quot;chapter&quot;:[0,&quot;第一章 儿童少年生长发育&quot;],&quot;section&quot;:[0,&quot;连续性&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述追赶性生长的概念、发生条件及其对健康的两面性。&quot;],&quot;answer&quot;:[1,[[0,&quot;追赶性生长指疾病、营养不良或心理应激造成暂时性生长迟缓，当这些因素解除后，机体向原生长轨迹回归的加速生长。发生条件是存在可逆的暂时性阻滞并已去除病因。年龄越小越明显、加速幅度越大。它能使生长回到遗传潜能决定的轨道，但过快追赶（尤其小于胎龄儿的体重追赶）伴随脂肪堆积和胰岛素抵抗提前出现，增加后期代谢风险。&quot;]]],&quot;explanation&quot;:[0,&quot;答题要写三层：定义（因素解除后向原轨迹回归）、条件（暂时性阻滞、可逆）、两面性（回到轨道 vs 过快追赶的代谢代价）。只写“补回来长得快”只能拿一半分，风险那一层常被漏掉。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年生长发育&quot;],&quot;page&quot;:[0,&quot;50-54&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;追赶性生长&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch01-c12&quot;],&quot;chapterKey&quot;:[0,&quot;ch01&quot;],&quot;chapter&quot;:[0,&quot;第一章 儿童少年生长发育&quot;],&quot;section&quot;:[0,&quot;追赶性生长（英文题）&quot;],&quot;type&quot;:[0,&quot;english&quot;],&quot;stem&quot;:[0,&quot;A 7-year-old boy had recurrent infections and poor appetite for a year, and his height dropped below his previous growth curve. After treatment and improved nutrition, he grew 9 cm in the following year. Explain catch-up growth, and discuss both its benefit and its risk.&quot;],&quot;answer&quot;:[1,[[0,&quot;追赶性生长（catch-up growth）指疾病、营养不良或心理应激造成暂时性生长迟缓，当这些因素解除后，机体向原生长轨迹（growth trajectory）回归的加速生长，年龄越小越明显、幅度越大。益处是使生长水平回到由遗传潜能决定的轨道，减少永久性矮小。风险是追赶过快，尤其小于胎龄儿（SGA）的体重追赶，会伴随脂肪堆积和胰岛素抵抗提前出现，增加成年期代谢性疾病风险。&quot;]]],&quot;explanation&quot;:[0,&quot;英文题按“定义—年龄特点—两面性”组织。关键词要出现 catch-up growth、growth trajectory、SGA；只答 grows faster 而不提 trajectory 与 metabolic risk，得分不全。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：23年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/tYprl3obA7DbUP1ac7tulQ&quot;]}],[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年生长发育&quot;],&quot;page&quot;:[0,&quot;50-54&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;追赶性生长&quot;],[0,&quot;英文题&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch02-c01&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;体格发育&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;课件所说的体格发育，包括形态、比例和：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;体型&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;体能&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;骨龄&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;成熟度&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;体格发育指人体外部形态、身体比例和体型随年龄的变化，三样都要看。体能属另一条线，骨龄是成熟度的指标，成熟度衡量的是达到成人水平的比例，都不是体格发育的组成部分。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年身体发育&quot;],&quot;page&quot;:[0,&quot;4&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;体格发育&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch02-c02&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;身体比例&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;（身高－坐高）/身高×100% 表示的是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;下肢长占身高的百分比&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;下肢长与坐高的比值&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;坐高占身高的百分比&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;身体的充实程度&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;分子是身高减坐高，即下肢长；分母是身高，所以得到下肢占身高的百分比。若分母换成坐高，才是下肢相对躯干的比例。两个指数只差分母，做纵向比较时不能混用。考场上一眼分辨：分母是身高看占比，分母是坐高看比例。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年身体发育&quot;],&quot;page&quot;:[0,&quot;19&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;身体比例&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch02-c03&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;身体比例&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;新生儿头长约占身长的比例，以及成人相应的比例分别是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;25%、15%&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;15%、25%&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;33%、20%&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;20%、10%&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;新生儿头长约占身长 25%，成人只占 15% 左右。这是头尾发展律的量化版本：头先长、四肢后长，所以头身比一路变小。B 把两个数字对调，是最常见的错项。若题干问“头身比”，答的是身高与头长的比值，方向与之相反。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年身体发育&quot;],&quot;page&quot;:[0,&quot;20&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;身体比例&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch02-c04&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;体能&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;健康相关体能五要素中，心肺功能指的是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;为肌肉供氧供能的能力&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;关节活动幅度与组织伸展能力&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;肌肉一次收缩能发出的最大力量&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;肌肉多次重复收缩的持久能力&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;五要素分别是体成分、心肺功能、柔韧性、肌力、肌耐力。B 是柔韧性，C 是肌力，D 是肌耐力。心肺功能的核心是供氧供能，对应指标是最大吸氧量、肺活量等。记五要素时按“成分—心肺—柔韧—肌力—肌耐力”的顺序背，不容易漏项。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年身体发育&quot;],&quot;page&quot;:[0,&quot;28&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;体能&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch02-c05&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;体能&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;课件归纳的体能发育特点包括：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;不均衡性&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;阶段性&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;不平衡性&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;性别特征&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;完全可逆性&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;]]],&quot;explanation&quot;:[0,&quot;四个特点是不均衡性（不同指标速度不同）、阶段性（快慢速增长期交替）、不平衡性（四肢早于躯干、大肌群早于小肌群）、性别特征（越大差异越明显）。“完全可逆”不是课件提法，也过于绝对。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年身体发育&quot;],&quot;page&quot;:[0,&quot;31-34&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;体能发育特点&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch02-c06&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;体能&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;约 85% 的女童在 12～15 岁这一阶段运动能力停滞或下降。&quot;],&quot;answer&quot;:[1,[[0,&quot;true&quot;]]],&quot;explanation&quot;:[0,&quot;课件给出这个比例，说明青春期女孩运动能力下滑是群体现象，与体脂增加、活动减少和社会期待都有关，不是个别孩子不努力。记数字时注意年龄段是女 12～15 岁。这也解释了为什么初中女生体育课参与度下降不能简单归因于态度。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年身体发育&quot;],&quot;page&quot;:[0,&quot;33&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;体能发育特点&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch02-c07&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;体力活动&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;按课件的代谢当量（MET）划分，中等强度活动对应：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;＜3 MET&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;3～6 MET&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;＞6 MET&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;≥10 MET&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;1 MET 相当于 1 kcal/kg/h。轻度活动 ＜3，中等强度 3～6，强度略高 ＞6。步行 4 km/h 约 2.9 属轻度，慢跑 7.0 属高强度，跳绳 10.0。用这张表能判断体育课有没有达到中高强度。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年身体发育&quot;],&quot;page&quot;:[0,&quot;37&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;MET&quot;],[0,&quot;体力活动&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch02-c08&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;体力活动&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;WHO 对 5～17 岁儿童少年的体力活动建议是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;每天累计至少 60 min 中等至高强度活动&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;每周 3 次、每次 20 min&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;每天 30 min 低强度活动&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;每周累计 150 min 高强度活动&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;WHO 建议 5～17 岁每天累计至少 60 min 中等至高强度活动，以有氧为主，每周至少 3 次包含强壮肌肉和骨骼的高强度活动。D 是成人标准，A 与 D 混淆是常见错点。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年身体发育&quot;],&quot;page&quot;:[0,&quot;36&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;体力活动&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch02-c09&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;体成分&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;什么是脂肪重聚？为什么说脂肪重聚越早，后期肥胖风险越大？&quot;],&quot;answer&quot;:[1,[[0,&quot;脂肪重聚指 BMI 在婴儿期上升、幼儿期（约 1～5 岁）下降、之后再次上升的过程中，最低点之后开始回升的那个转折点。回升越早，说明脂肪积累的第二次上升来得越早，课件四个案例显示早回升的孩子（2 岁、4.5 岁）后期超重，晚回升的（8 岁）偏轻或不再超重，因此幼儿期 BMI 低不能盲目乐观，要看回升时间。&quot;]]],&quot;explanation&quot;:[0,&quot;答题要写出三段曲线（婴儿期升、幼儿期降、之后升）和“最低点后的转折点”这个定义，再用案例说明早回升与后期超重的对应关系。只说“BMI 又升高”不算定义。案例中“1 岁重、2 岁回升”与“1 岁轻、4.5 岁回升”都属早期回升，结局都偏胖。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年身体发育&quot;],&quot;page&quot;:[0,&quot;47&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;脂肪重聚&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch02-c10&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;Scammon 生长模式（英文题）&quot;],&quot;type&quot;:[0,&quot;english&quot;],&quot;stem&quot;:[0,&quot;Please describe Scammon&#39;s four growth patterns of body tissues and organs, and give one example of an organ for each pattern.&quot;],&quot;answer&quot;:[1,[[0,&quot;Scammon 把身体组织器官的生长分为四型：一般型（general type）包括肌肉、骨骼和主要脏器，生后第一年增长最快，青春期出现第二次突增；神经系统型（neural type）包括脑、脊髓、视觉器官和头围，只有一个突增期，主要在胎儿期至 6 岁前；淋巴系统型（lymphoid type）包括胸腺和淋巴结，生后头 10 年迅速增长，12 岁左右达成人的 200%，之后逐渐萎缩；生殖系统型（genital type）前 10 年几乎不发展，青春期后迅速生长。&quot;]]],&quot;explanation&quot;:[0,&quot;英文题干、中文作答。四型要各写代表器官与曲线特点，重点在淋巴型的 200% 与神经型“只有一个突增期”。只答 growth patterns 的定义而不举例，得分不全。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：23年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/tYprl3obA7DbUP1ac7tulQ&quot;]}],[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 儿童少年身体发育&quot;],&quot;page&quot;:[0,&quot;20&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;Scammon&quot;],[0,&quot;英文题&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch03-c01&quot;],&quot;chapterKey&quot;:[0,&quot;ch03&quot;],&quot;chapter&quot;:[0,&quot;第三章 儿童少年心理行为发育&quot;],&quot;section&quot;:[0,&quot;感知觉&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;看到苹果的红色、闻到它的香味，属于感觉；由此认出“这是一个苹果”，属于：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;感觉&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;知觉&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;错觉&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;想象&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;感觉反映个别属性（颜色、气味），知觉把感觉信息组织成对事物的整体认识。认出苹果是整合颜色、形状、气味的结果，属知觉。错觉是知觉的歪曲，想象是对表象的改造。题干若出现“认出”“判断是什么”，基本都落在知觉层面。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 第四章 儿童少年心理行为发育&quot;],&quot;page&quot;:[0,&quot;6-12&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;感觉与知觉&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch03-c02&quot;],&quot;chapterKey&quot;:[0,&quot;ch03&quot;],&quot;chapter&quot;:[0,&quot;第三章 儿童少年心理行为发育&quot;],&quot;section&quot;:[0,&quot;感知觉&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;视觉悬崖实验说明婴儿已经具备：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;深度知觉&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;颜色恒常性&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;形状知觉&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;大小恒常性&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;婴儿在“悬崖”边犹豫不敢过，说明他能判断高低落差，即深度知觉已具备，不靠摔跤经验获得。这个实验常被用来反驳“知觉全靠后天学习”的说法。实验的关键设计是视觉悬崖上铺了玻璃板，婴儿不敢过是因为看见了落差。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 第四章 儿童少年心理行为发育&quot;],&quot;page&quot;:[0,&quot;26&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;深度知觉&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch03-c03&quot;],&quot;chapterKey&quot;:[0,&quot;ch03&quot;],&quot;chapter&quot;:[0,&quot;第三章 儿童少年心理行为发育&quot;],&quot;section&quot;:[0,&quot;注意&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;按课件的时间表，3～4 岁儿童有意注意可持续的时间约为：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;7 分钟&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;15 分钟&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;20 分钟&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;30 分钟&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;有意注意时长：3～4 岁 7 分钟、5～6 岁 15 分钟、7～8 岁 20 分钟、10～11 岁 25 分钟、12～15 岁 30 分钟。小学低年级一节课要切换活动，正是按这个生理限制设计的。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot; ;演绎推理&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;客体永久性指物体不在眼前时仍知道它存在，是感知运动阶段（0～2 岁）的重要获得。守恒在具体运算阶段，自我中心是前运算阶段的特点，演绎推理要到形式运算阶段。皮亚杰四阶段的顺序不能颠倒，客体永久性是最早出现的一个标志。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 第四章 儿童少年心理行为发育&quot;],&quot;page&quot;:[0,&quot;5&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;皮亚杰&quot;],[0,&quot;客体永久性&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch03-c06&quot;],&quot;chapterKey&quot;:[0,&quot;ch03&quot;],&quot;chapter&quot;:[0,&quot;第三章 儿童少年心理行为发育&quot;],&quot;section&quot;:[0,&quot;语言&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;幼儿说“车”，意思是“我要那个车”，这体现单词句的哪个特点？&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;以词代句&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;一词多义&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;以音代物&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;单音重复&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;单词句有四个特点：单个字或单音重复、一词多义、以音代物、以词代句。用一个词表达一句话的意思，就是以词代句，具体含义靠情境补全。单词句一般出现在 1～1.5 岁，是语言准备期之后的第一阶段。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1 第四章 儿童少年心理行为发育&quot;],&quot;page&quot;:[0,&quot;41&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;单词句&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch03-c07&quot;],&quot;chapterKey&quot;:[0,&quot;ch03&quot;],&quot;chapter&quot;:[0,&quot;第三章 儿童少年心理行为发育&quot;],&quot;section&quot;:[0,&quot;气质&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;托马斯和切斯的气质四型中，占比最多的是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&q t;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c06&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;课后题·判断&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;男性性发育成熟时，阴毛分布至下腹部中线，呈菱形分布。&quot;],&quot;answer&quot;:[1,[[0,&quot;true&quot;]]],&quot;explanation&quot;:[0,&quot;Tanner 五期的男性 5 期描述就是阴毛菱形分布并延伸至下腹中线；女性则为倒三角形。这一差别源于雄激素水平与分布不同，是判断性别与成熟度的形态学依据。男性阴毛可向上延伸至脐，女性上缘平直，这是两者最容易分辨的形态差别。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;46&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;阴毛分布&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c07&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;课后题·名词&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;名词解释：青春期（adolescence）&quot;],&quot;answer&quot;:[1,[[0,&quot;青春期是个体从童年向成年逐渐过渡的时期。WHO 从三方面界定：生理上从出现第二性征到性成熟，心理上从儿童认知方式发展到成人认知方式，社会上从经济依赖到相对独立。研究上通常取 10～19 岁。&quot;]]],&quot;explanation&quot;:[0,&quot;答题要写“过渡时期”这个核心，再补生理、心理、社会三个坐标与 10～19 岁的区间。只写“长身体、性成熟”会漏掉心理与社会两个维度。WHO 的三方面界定是这道名词解释的骨架，缺一维就答不完整。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;4-5&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;名词解释&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c08&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;课后题·名词&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;名词解释：青春发育进程（pubertal procession）&quot;],&quot;answer&quot;:[1,[[0,&quot;青春发育进程指在某一时点，个体在整个青春期中处于的绝对位置，回答的是“走到哪一步了”。它与青春发动时相不同：后者指各发育事件依次出现的时间模式，回答的是“按什么顺序、什么时候发生”。&quot;]]],&quot;explanation&quot;:[0,&quot;这是三个易混名词之一。记法：进程是位置（进度条），发动期是过程（4.5 年的生物学成熟），发动时相是时间表（顺序与早晚）。答题时把“位置”与“模式”对比写出来最稳。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;8&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;名词解释&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c09&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;课后题·名词&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;名词解释：青春发动期（puberty）&quot;],&quot;answer&quot;:[1,[[0,&quot;青春发动期指生殖系统发育与成熟的生物学过程，平均持续约 4.5 年（1.5～6 年）。它是青春期这一更长阶段中的一段，强调激素驱动下生殖系统从幼稚到成熟的过程本身。&quot;]]],&quot;explanation&quot;:[0,&quot;要与“青春期（10～19 岁这一人生阶段）”和“发动时相（事件出现的时间模式）”区分：发动期讲的是过程与时长，约 4.5 年这个数字是考点。记住三个数字：阶段 10～19 岁、发动期约 4.5 年、初潮多在 12～13 岁。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;8&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;名词解释&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c10&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;课后题·名词&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;名词解释：青春发动时相（puberty timing）&quot;],&quot;answer&quot;:[1,[[0,&quot;青春发动时相指青春期各发育事件（生长突增、乳房发育、阴毛出现、月经初潮等）依次出现的时间模式，包括启动的早晚与事件的先后顺序。它既有个体差异，也受遗传、营养和社会经济水平影响。&quot;]]],&quot;explanation&quot;:[0,&quot;关键词是“时间模式”“顺序与早晚”。写“发育的年龄”只对一半——时相还包含事件之间的先后关系，这是它区别于“青春期年龄区间”的地方。时相研究的现实意义是判断“早发育”与“晚发育”，而不是给所有孩子定同一时间表。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;8&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;名词解释&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c11&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;课后题·名词&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;名词解释：身高速度高峰（peak height velocity，PHV）&quot;],&quot;answer&quot;:[1,[[0,&quot;身高速度高峰指青春期生长突增过程中身高增长速度达到的最高点，其对应年龄称 PHA（身高速度高峰年龄）。课件给出的年均增幅为女 9～10 cm、男 10～12 cm，女孩 PHA 多出现在 12 岁、男孩多在 13 岁。&quot;]]],&quot;explanation&quot;:[0,&quot;要写清三件事：是速度的最高点（不是身高的最高值）、对应年龄叫 PHA、男女数值不同。把它理解成“长得最高的年龄”是最常见的错误。PHV 的数值女 9～10 cm、男 10～12 cm，是判断突增是否正常的参照。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;15-19&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;PHV&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c12&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;课后题·名词&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;名词解释：体重速度高峰（peak weight velocity，PWV）&quot;],&quot;answer&quot;:[1,[[0,&quot;体重速度高峰指青春期生长突增过程中体重增长速度达到的最高点，对应年龄称体重速度高峰年龄。课件给出的高峰年龄为男 14 岁、女 13 岁，均晚于身高速度高峰，这是青春期“先长个、后长肉”的量化表现。&quot;]]],&quot;explanation&quot;:[0,&quot;重点是 PWV 晚于 PHV（男 14 岁 vs 13 岁、女 13 岁 vs 12 岁），以及“速度高峰不等于体重最大值”。把两者混为一谈会同时答错两道题。PWV 与 PHV 间隔约 1 年，这是“先长个、后长肉”的时间依据。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;15-19&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;PWV&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c13&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;课后题·名词&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;名词解释：成熟裂隙（maturity gap）&quot;],&quot;answer&quot;:[1,[[0,&quot;成熟裂隙指青少年无法调和生物学成熟与心理社会成熟之间的差异时，出现的社会适应困难和情感障碍。它的背景是初潮等生理成熟年龄不断提前，而完成学业、经济独立等社会成熟年龄推后，两者之间的落差被拉大。&quot;]]],&quot;explanation&quot;:[0,&quot;答题要写出“两种成熟不同步”和“后果（适应困难、情感障碍）”。它与社会心理视角的“失匹配”指同一现象，前者偏社会心理，后者偏脑发育，可对照记忆。干预思路也由此而来：要么提前社会成熟的支持，要么淡化对生理成熟的过度强调。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;60-61&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;成熟裂隙&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c14&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;课后题·简答&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述按实际年龄与按 PHA 制作的生长发育曲线有何区别。&quot;],&quot;answer&quot;:[1,[[0,&quot;按实际年龄作图时，由于个体 PHA 差异很大，各人的突增高峰被摊平在不同的年龄点上，曲线的峰值被压低、变异增大。按 PHA 作图把每个人的高峰对齐到同一位置，突增高峰更明显、峰值均值更大、标准差和变异度更小。因此评价个体生长速度时，最好把两套参考值结合使用。&quot;]]],&quot;explanation&quot;:[0,&quot;答题结构：现象（按年龄被摊平）—原因（PHA 变异大）—结果（峰值低、变异大）—应用（两套参考值结合）。只写“一个明显一个不明显”拿不到过程分。按 PHA 曲线用于个体评价，按年龄曲线用于群体筛查，两者互补而非替代。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;32&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;PHA&quot;],[0,&quot;生长曲线&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c15&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;课后题·简答&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述男性性发育和女性性发育过程中重要事件的发育时相。&quot;],&quot;answer&quot;:[1,[[0,&quot;男性：睾丸增大约 11.5 岁开始，随后阴茎增长并伴身高突增，阴毛约 11～12 岁出现，之后腋毛、胡须依次出现，首次遗精多在 12～18 岁，遗精后身高增速减慢。女性：乳房发育最早，平均约 11 岁；阴毛在乳房发育后 6 个月至 1 年出现，腋毛再晚半年至 1 年；月经初潮多发生在 Tanner 4 期，是生殖功能成熟的外在标记，但初潮时卵巢、子宫重量仅为成熟时的 30%～40%。&quot;]]],&quot;explanation&quot;:[0,&quot;男女各写“顺序＋关键年龄＋标志事件”三样。女性要补一句初潮不等于具备生育能力（生理不孕期），男性要补首次遗精后身高增速减慢，这两句是拉开分差的地方。考试若只问女性，也要顺带写出男性顺序，避免只答一半。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;44-53&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;性发育时相&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch04-c16&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;青春期定义（英文题）&quot;],&quot;type&quot;:[0,&quot;english&quot;],&quot;stem&quot;:[0,&quot;Please explain the terms puberty and puberty timing, and give one example showing individual variation in puberty timing.&quot;],&quot;answer&quot;:[1,[[0,&quot;Puberty（青春发动期）指生殖系统发育与成熟的生物学过程，平均持续约 4.5 年（1.5～6 年）。Puberty timing（青春发动时相）指各发育事件依次出现的时间模式，包括启动早晚与事件先后顺序。个体差异的例子：女孩乳房发育平均约 11 岁开始，但正常范围可提前或延后数年，初潮年龄也随之不同，这种启动早晚的差别就是 puberty timing 的差异。&quot;]]],&quot;explanation&quot;:[0,&quot;题干要求区分两个术语并举例。puberty 讲过程与时长（约 4.5 年），puberty timing 讲时间模式与早晚。只把两者都译成“青春期”会直接丢分。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：24年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/BlGXCsyQJYDkDoDDqdTVVA&quot;]}],[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;2026-2027-1  青春期生长发育&quot;],&quot;page&quot;:[0,&quot;4-8&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;青春期&quot;],[0,&quot;英文题&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch05-c01&quot;],&quot;chapterKey&quot;:[0,&quot;ch05&quot;],&quot;chapter&quot;:[0,&quot;第五章 生长发育影响因素&quot;],&quot;section&quot;:[0,&quot;遗传度&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;遗传度的定义强调三个关键词，它们是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;群体、变异、比例&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;个体、水平、绝对值&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;家系、突变、遗传率&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;环境、年龄、性别&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;遗传度是估计某一性状在群体中有多大比例的变异由遗传因素决定，所以必须咬住“群体、变异、比例”。它是群体指标，不能拆到个人头上，这也是“我的身高 80% 来自遗传”说不通的原因。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第6讲 生长发育影响因素&quot;],&quot;page&quot;:[0,&quot;6&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;遗传度&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch05-c02&quot;],&quot;chapterKey&quot;:[0,&quot;ch05&quot;],&quot;chapter&quot;:[0,&quot;第五章 生长发育影响因素&quot;],&quot;section&quot;:[0,&quot;遗传度&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;同一性状用 GWAS 与双生子研究估计遗传度，结果常有很大差距，这种现象称为：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;遗传度缺失&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quo [0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;甲醛&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;]]],&quot;explanation&quot;:[0,&quot;物理性污染分噪声、电磁辐射、放射性污染三类。铅属重金属、甲醛属室内空气污染物，两者都归在化学性污染。污染分类按“作用性质”划，不是按“有没有害”划。室内空气污染的三个主要来源是燃料燃烧、建筑材料和家具。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第6讲 生长发育影响因素&quot;],&quot;page&quot;:[0,&quot;25&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;物理性污染&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch05-c08&quot;],&quot;chapterKey&quot;:[0,&quot;ch05&quot;],&quot;chapter&quot;:[0,&quot;第五章 生长发育影响因素&quot;],&quot;section&quot;:[0,&quot;化学性污染&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;因为血铅低于 5 微克/分升时没有明显症状，所以可以认为存在安全的血铅水平。&quot;],&quot;answer&quot;:[1,[[0,&quot;false&quot;]]],&quot;explanation&quot;:[0,&quot;课件的结论是任何铅暴露都可能产生不良影响，不存在“安全”的血铅水平，理想情况下血铅应为零。分档只描述不同水平下的典型表现，低剂量段损害的是智力和学业，孩子看着没病并不等于没受影响。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第6讲 生长发育影响因素&quot;],&quot;page&quot;:[0,&quot;23&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;铅&quot;],[0,&quot;血铅&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch05-c09&quot;],&quot;chapterKey&quot;:[0,&quot;ch05&quot;],&quot;chapter&quot;:[0,&quot;第五章 生长发育影响因素&quot;],&quot;section&quot;:[0,&quot;家庭环境&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;父母经常争吵、家庭氛围紧张，会阻碍儿童心理健康发展，使其容易出现情绪多变与社交退缩。&quot;],&quot;answer&quot;:[1,[[0,&quot;true&quot;]]],&quot;explanation&quot;:[0,&quot;课件把家庭氛围列为家庭环境六项之一：温馨氛围对健全人格有正向作用，紧张氛围（含家庭暴力）阻碍心理健康，孩子易情绪多变、社交退缩、出现问题行为。家庭环境对小年龄儿童的作用更显著。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第6讲 生长发育影响因素&quot;],&quot;page&quot;:[0,&quot;29&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;家庭环境&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch05-c10&quot;],&quot;chapterKey&quot;:[0,&quot;ch05&quot;],&quot;chapter&quot;:[0,&quot;第五章 生长发育影响因素&quot;],&quot;section&quot;:[0,&quot;膳食&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;按《中国学龄儿童膳食指南》，一日三餐的能量分配比例应为：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;3∶4∶3&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;2∶5∶3&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;3∶3∶4&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;4∶4∶2&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;早、中、晚三餐能量比为 3∶4∶3，午餐占比最高。不吃早餐或早餐营养不足，会降低上午学习效率、影响认知能力，还会导致体能下降、影响体格发育。指南同时要求吃好早餐、合理选择零食，这三条常一起出现在多选题里。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第6讲 生长发育影响因素&quot;],&quot;page&quot;:[0,&quot;34&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;膳食&quot;],[0,&quot;三餐比例&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch05-c11&quot;],&quot;chapterKey&quot;:[0,&quot;ch05&quot;],&quot;chapter&quot;:[0,&quot;第五章 生长发育影响因素&quot;],&quot;section&quot;:[0,&quot;体育锻炼&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;按课件分组，“学习效率”被列在体育锻炼作用的哪一类下？&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;身体发育—其他&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;心理行为发育&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;社会适应&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;不属于体育锻炼的作用&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;课件把“其他——内分泌、学习效率”放在身体发育分支下，不是心理行为。这题考的是照课件口径答题：按常识容易把学习效率归到心理行为，但课件分组不同，答题以课件为准。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第6讲 生长发育影响因素&quot;],&quot;page&quot;:[0,&quot;35&quot;]}]]],&quot;discrepancy&quot;:[0,{&quot;status&quot;:[0,&quot;courseware_only&quot;],&quot;courseware&quot;:[0,&quot;p35 把“其他——内分泌、学习效率”列在身体发育分支下&quot;],&quot;note&quot;:[0,&quot;按常识，学习效率更像心理行为或认知结果；本题按课件分组作答。若考试按教材口径判归心理行为，以教材为准。&quot;]}],&quot;tags&quot;:[1,[[0,&quot;体育锻炼&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch05-c12&quot;],&quot;chapterKey&quot;:[0,&quot;ch05&quot;],&quot;chapter&quot;:[0,&quot;第五章 生长发育影响因素&quot;],&quot;section&quot;:[0,&quot;地理气候&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;为“我国南北方儿童少年身高差异”设计一个至少包含三层原因的解释框架。&quot;],&quot;answer&quot;:[1,[[0,&quot;第一层是地理气候：日照时长、气温、降水等影响户外活动时间、维生素 D 合成与能量消耗。第二层是遗传背景：不同群体的起源与遗传构成存在差异。第三层是社会经济与膳食：经济发展水平、食物可及性、膳食结构和生活方式不同。课件还提示地域差异尤其是长期趋势，不全是地理气候作用的结果，因此三层要同时写，不能只归因于气候或基因。&quot;]]],&quot;explanation&quot;:[0,&quot;评分看“分层”而不是“穷举”。三层是气候、遗传、社会经济与膳食，最后补一句长期趋势的提醒（一代人普遍长高，基因库不会这样变）。把差异全归给气候是最常见的失分点。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第6讲 生长发育影响因素&quot;],&quot;page&quot;:[0,&quot;19&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;南北差异&quot;],[0,&quot;课后题&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch06-c01&quot;],&quot;chapterKey&quot;:[0,&quot;ch06&quot;],&quot;chapter&quot;:[0,&quot;第六章 生长发育调查与评价&quot;],&quot;section&quot;:[0,&quot;调查设计&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;要获得某群体儿童的生长速度资料，最合适的调查设计是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;横断面设计&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;t t;single&quot;],&quot;stem&quot;:[0,&quot;关于现状正常值与理想正常值，下列说法正确的是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;现状正常值样本来自本地中等水平人群，只剔除慢性病或残障者&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;理想正常值低于现状正常值&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;现状正常值建立后可长期使用不必修订&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;理想正常值要求样本包含慢性病儿童&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;现状正常值样本取自本地中等水平人群、只排除慢病与残障，反映真实情况并作为干预目标；理想正常值要求足月正常体重、环境适宜、潜力充分发挥，因而高于现状正常值。现状正常值有时段性，应每 5～10 年修订。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第7讲 生长发育调查与评价&quot;],&quot;page&quot;:[0,&quot;27-30&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;正常值&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch06-c04&quot;],&quot;chapterKey&quot;:[0,&quot;ch06&quot;],&quot;chapter&quot;:[0,&quot;第六章 生长发育调查与评价&quot;],&quot;section&quot;:[0,&quot;质量控制&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;现场核对发现误差率超过 20%，正确处置是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;当日数据全部作废重测&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;只剔除误差个体继续&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;记录后照常使用&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;把误差率折算进结果&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;课件给的处置线是：误差率 P＞5% 要分析原因并改进，P＞20% 当日数据全部作废、重新测量。P＝∑n/(A×N)×100%，n 是错误项数、A 是检测项目数、N 是受检人数。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第7讲 生长发育调查与评价&quot;],&quot;page&quot;:[0,&quot;41&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;质量控制&quot t;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;]]],&quot;explanation&quot;:[0,&quot;A、B、C、D 都是课件明确要求：固定时间减少季节与日内波动，同年龄均匀分配避免时段偏差，视力需暗适应，耐力测试易致疲劳故放最后。E 错，身高必须赤足，穿鞋会使读数偏高。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第7讲 生长发育调查与评价&quot;],&quot;page&quot;:[0,&quot;37-40&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;质量控制&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch06-c07&quot;],&quot;chapterKey&quot;:[0,&quot;ch06&quot;],&quot;chapter&quot;:[0,&quot;第六章 生长发育调查与评价&quot;],&quot;section&quot;:[0,&quot;质量控制&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;现场误差率超过 20% 时，当日数据应全部作废并重新测量。&quot;],&quot;answer&quot;:[1,[[0,&quot;true&quot;]]],&quot;explanation&quot;:[0,&quot;课件把 5% 和 20% 设为两条线：超过 5% 要分析原因、改进方法；超过 20% 说明当日测量系统性失效，数据不可用，必须整批作废重测。只剔除个别错误个体不足以纠正系统性偏差。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第7讲 生长发育调查与评价&quot;],&quot;page&quot;:[0,&quot;41&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;误差率&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch06-c08&quot;],&quot;chapterKey&quot;:[0,&quot;ch06&quot;],&quot;chapter&quot;:[0,&quot;第六章 生长发育调查与评价&quot;],&quot;section&quot;:[0,&quot;水平评价&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;写出离差法五等级评价的界值与对应的理论频数。&quot;],&quot;answer&quot;:[1,[[0,&quot;上等：大于 x̄+2s（&gt;P97），理论频数 2.3%；中上等：+1s～+2s，13.55%；中等：±1s，68.3%；中下等：-2s～-1s，13.55%；下等：小于 -2s（＜P3），2.3%。判读时先算均值与标准差，再看个体值落在哪一段。&quot;]]],&quot;explanation&quot;:[0,&quot;五个界值和四个频数要成对记：两端各 2.3%，中上与中下各 13.55%，中间 68.3%，加起来 100%。容易错的是把 ±1s 写成 95%，那是 ±2s 的累计范围。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第7讲 生长发育调查与评价&quot;],&quot;page&quot;:[0,&quot;47-53&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;离差法&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch06-c09&quot;],&quot;chapterKey&quot;:[0,&quot;ch06&quot;],&quot;chapter&quot;:[0,&quot;第六章 生长发育调查与评价&quot;],&quot;section&quot;:[0,&quot;水平评价&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;比较离差法、百分位数法与 Z 分法评价生长发育水平的优缺点。&quot;],&quot;answer&quot;:[1,[[0,&quot;离差法用均值与标准差分级，计算简单、适合基层，但对偏态指标（体重、BMI）不精确，只能单指标、不能反映匀称度与动态。百分位数法把指标排序分百等份，可用于偏态分布，但两端 P3、P97 摆动大、准确性差。Z 分法以中位数为中心把偏态转成正态，无单位、便于横向纵向比较且不必考虑性别年龄，但样本本身的偏态未被根本纠正。&quot;]]],&quot;explanation&quot;:[0,&quot;三种方法按“适用分布—精度—可比性”三条线对比：离差法要求近似正态，百分位法容忍偏态但两端不稳，Z 分法可比性最好。答题时每种方法各写一条优点、一条局限。实际工作中常把百分位法与 Z 分法结合：用 Z 分判断极端值，用百分位向家长解释。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第7讲 生长发育调查与评价&quot;],&quot;page&quot;:[0,&quot;47-59&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;评价方法&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch07-c01&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 儿童少年健康问题与策略&quot;],&quot;section&quot;:[0,&quot;疾病指标&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;评价某校学生贫血的现患情况，应选用的指标是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;发病率&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;患病率&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;罹患率&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;某病死亡率&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;患病率是调查或检查当时受检人数中患病或阳性的比例，适合贫血、龋齿、弱视这类慢性或现患状态。发病率强调“新发”，罹患率是其短时间、小范围的特例，多用于传染病暴发与食物中毒。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第八讲 儿童少年健康问题、健康状况和健康促进策略&quot;],&quot;page&quot;:[0,&quot;7-9&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;患病率&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch07-c02&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 儿童少年健康问题与策略&quot;],&quot;section&quot;:[0,&quot;疾病指标&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;某小学午餐后 3 小时内 40 名学生出现呕吐腹泻，描述这一事件的频率应使用：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;发病率&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;患病率&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;罹患率&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;病死率&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;C&quot;]]],&quot;explanation&quot;:[0,&quot;罹患率指某一局限范围（一所学校、一个幼儿园）短时间内的发病率，专门用于传染病暴发、食物中毒这类集中事件。它与发病率算法相同，差别在时间窗短、范围小，强调“暴发”。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第八讲 儿童少年健康问题、健康状况和健康促进策略&quot;],&quot;page&quot;:[0,&quot;7-9&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;罹患率&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch07-c03&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 儿童少年健康问题与策略&quot;],&quot;section&quot;:[0,&quot;生命指标&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;婴儿死亡率在反映儿童保健质量上的主要局限是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;新生儿死亡占婴儿死亡的 40%～50%，无法反映更大儿童的情况&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;它不能反映社会经济水平&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;它只统计住院死亡&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;它不受战争与饥荒影响&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;IMR 对社会动荡、经济危机都很敏感，也能反映卫生保健水平，但新生儿死亡占婴儿死亡的 40%～50%，且只覆盖 1 岁以内，所以单看它反映儿童保健质量并不到位，需与 5 岁以下儿童死亡率合用。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第八讲 儿童少年健康问题、健康状况和健康促进策略&quot;],&quot;page&quot;:[0,&quot;10-13&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;婴儿死亡率&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch07-c04&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 儿童少年健康问题与策略&quot;],&quot;section&quot;:[0,&quot;健康状态&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;躯体、心理、社会适应上有不适，但物理或生化检查常无异常，这种状态称为：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;健康&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;亚健康&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;疾病&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;残疾&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;课件把健康状态排成“完好状态—亚健康—疾病”一条轴，亚健康是中间段：有不适主诉但检查无异常。它解释了“查不出病但总不舒服”为何真实存在，也提示评价不能只看化验单。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第八讲 儿童少年健康问题、健康状况和健康促进策略&quot;],&quot;page&quot;:[0,&quot;6&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;亚健康&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch07-c05&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 儿童少年健康问题与策略&quot;],&quot;section&quot;:[0,&quot;健康维度&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;“利他、真善美”属于健康四个维度中的：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;身体健康&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;心理健康&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;良好社会适应&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;道德健康&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;D&quot;]]],&quot;explanation&quot;:[0,&quot;四维度是身体健康、心理健康、良好社会适应、道德健康。道德健康的核心是利他与真善美；社会适应看能否适应环境变化、被他人理解与接受；心理健康含症状行为、认知功能与主观幸福度。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第八讲 儿童少年健康问题、健康状况和健康促进策略&quot;],&quot;page&quot;:[0,&quot;2-5&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;健康维度&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch07-c06&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 儿童少年健康问题与策略&quot;],&quot;section&quot;:[0,&quot;生命指标&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;下列属于生命指标的有：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;婴儿死亡率&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;5 岁以下儿童死亡率&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;年龄别死亡率&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;某病病死率&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;因病缺课率&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;]]],&quot;explanation&quot;:[0,&quot;生命指标围绕死亡：婴儿死亡率、5 岁以下儿童死亡率、年龄别死亡率、某病病死率都属此类。因病缺课率属服务与影响指标，它反映疾病负担与监测灵敏度，不属生命指标。区分时看分子：死亡数归生命指标，缺课与就诊归服务与影响指标。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第八讲 儿童少年健康问题、健康状况和健康促进策略&quot;],&quot;page&quot;:[0,&quot;10-15&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;生命指标&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch07-c07&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 儿童少年健康问题与策略&quot;],&quot;section&quot;:[0,&quot;时代特征&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;课件归纳的儿童少年健康问题时代特征包括：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;压力来源多样化&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;静态行为增加&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;睡眠问题出现新特征&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;数字媒体带来新挑战&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;伤害已不再是主要死因&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;]]],&quot;explanation&quot;:[0,&quot;六条时代特征是压力多样化、静态行为增加（≤1.5 MET，多数学生日均超 8 小时）、睡眠新特征、数字媒体挑战、气候变化与环境污染、战争与冲突。E 错：伤害仍是 0～18 岁儿童死亡的首位原因。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第八讲 儿童少年健康问题、健康状况和健康促进策略&quot;],&quot;page&quot;:[0,&quot;30-35&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;时代特征&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch07-c08&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 儿童少年健康问题与策略&quot;],&quot;section&quot;:[0,&quot;服务指标&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;因病缺课被课件称为灵敏性与实用性都较高的疾病监测指标。&quot;],&quot;answer&quot;:[1,[[0,&quot;true&quot;]]],&quot;explanation&quot;:[0,&quot;因病缺课不需要等临床诊断就能反映孩子真实状态，数据易得、变化快，所以灵敏且实用。它属于服务与影响指标，与月病假率、平均因病缺课日数一起用于评价疾病负担。月病假率与平均因病缺课日数是它的两个常用具体指标。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第八讲 儿童少年健康问题、健康状况和健康促进策略&quot;],&quot;page&quot;:[0,&quot;14-15&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;因病缺课&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch07-c09&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 儿童少年健康问题与策略&quot;],&quot;section&quot;:[0,&quot;疾病指标&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;说明发病率与患病率的区别，并举一个把两者混用的错误例子。&quot;],&quot;answer&quot;:[1,[[0,&quot;发病率是一定时期内特定人群中新发病例的频率，分子是新发病例，强调“新发”；患病率是调查或检查当时受检者中患病或阳性的比例，分子是现患病例，包括新老病例。两者关系受病程影响：病程长则患病率高。错误例子：看到某校贫血患病率高就推断“今年贫血新发很多”，其实可能只是患病者持续时间长、检出充分。&quot;]]],&quot;explanation&quot;:[0,&quot;答题抓住三点：分子（新发 vs 现患）、时间（一段时期 vs 某一时点）、与病程的关系。举例要落到“高患病率不等于高新发”，这是最常见的误读。题目问“现患多少”选患病率，问“新发多少”才选发病率。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第八讲 儿童少年健康问题、健康状况和健康促进策略&quot;],&quot;page&quot;:[0,&quot;7-9&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;发病率&quot;],[0,&quot;患病率&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c01&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;近视&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;新生儿眼轴长度大约为：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;16.0 mm&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;18.7 mm&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;21.0 mm&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;24.0 mm&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;新生儿眼轴约 18.7 mm，3 岁男 23.2、女 22.5，14 岁男 24.0、16 岁女 23.5。眼球 1～3 岁增长最快（3 年约 4.5 mm），3 岁后缓慢。眼轴接近 24 mm 是正视化完成的重要标志。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;6&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;眼轴&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c02&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;近视&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;儿童正视化过程大约在几岁完成？&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;3 岁&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;6 岁&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;10 岁&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;14 岁&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;多数孩子出生时为远视，随眼轴变长、角膜与晶状体变平，屈光状态向正视发展，约 6 岁完成。此前的远视度数即“远视储备”，储备不足被定义为近视前驱期，是最值得干预的窗口。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;13-16&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;正视化&quot;],[0,&quot;远视储备&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c03&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;近视&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;按课件定义，视力低下是指对数视力表 5 米远处裸眼视力低于：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;4.8&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;4.9&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;5.0&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;5.1&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;C&quot;]]],&quot;explanation&quot;:[0,&quot;裸眼视力低于 5.0 即为视力低下。注意三个词不能互换：视力低下＝视力不良，但不等于视力下降；前者是状态判断，后者是动态变化。视力低下中 80% 以上是近视。视力低下是筛查结论，近视是屈光诊断，两者不能直接画等号。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;8-10&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;视力低下&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c04&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;近视&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;对数视力表 4.7～4.6 的视力低下属于：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;轻度&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;中度&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;重度&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;正常&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;分级是：轻度 4.9～4.8、中度 4.7～4.6、重度 4.5 以下。换算成国际标准分别约为 0.9～0.7、0.6～0.4、0.3 以下。数字越小越严重，别把 4.9 当成“接近 5.0 所以正常”。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;9&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;视力分级&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c05&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;近视&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;按近视的公共卫生分期，进入“发展期”的判定标准是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;年进展超过 50 度或眼轴增长超过 0.20 mm&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;裸眼视力低于 5.0&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;眼轴超过 26 mm&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;出现视网膜裂孔&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;]]],&quot;explanation&quot;:[0,&quot;发展期的判定是年进展＞50 度或眼轴增长＞0.20 mm/年，这是防高度近视的关键期。裸眼视力低于 5.0 只是视力低下；眼轴＞26 mm 或度数＞600 度属高度近视期；视网膜裂孔属病理性近视的并发症。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;13&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;近视分期&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c06&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;近视&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;判定为高度近视期的标准是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;度数超过 300 度&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;度数超过 600 度或眼轴超过 26.00 mm&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;眼轴超过 24.00 mm&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;裸眼视力低于 4.6&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;高度近视期指度数＞600 度或眼轴＞26.00 mm，此时视网膜脱离、黄斑出血、青光眼等并发症风险明显升高。24 mm 左右是正视化后的正常眼轴，300 度属中度近视范围。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;13&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;高度近视&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c07&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;肥胖&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;遗传因素大约能解释儿童肥胖 BMI 差异的：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;10%～20%&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;20%～40%&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;40%～70%&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;80%～90%&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;C&quot;]]],&quot;explanation&quot;:[0,&quot;课件给出遗传约解释 BMI 差异的 40%～70%，已发现 70 多个位点。这说明遗传贡献大但不是决定性的——剩下 30%～60% 来自膳食、活动、肠道菌群与家庭环境，也正是干预的空间。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;29&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;肥胖&quot;],[0,&quot;遗传&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c08&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;肥胖&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;青春期肥胖持续到成年后仍肥胖的概率约为：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;30% 以上&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;50% 以上&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;70% 以上&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;90% 以上&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;C&quot;]]],&quot;explanation&quot;:[0,&quot;青春期肥胖延续到成年的概率超过 70%，这是把青春期列为肥胖防控关键期的直接理由。再加上脂肪重聚期（5～7 岁）与胎儿期、婴儿期，共四个敏感期。四个敏感期提示干预窗口，越靠前的窗口干预成本越低、收益越大。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;31&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;肥胖&quot;],[0,&quot;敏感期&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c09&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;近视&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;近视的公共卫生分期包括：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;前驱期&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;发展期&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;高度近视期&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;病理性近视期&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;恢复期&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;]]],&quot;explanation&quot;:[0,&quot;四期是前驱期（远视储备不足）、发展期（年进展＞50 度或眼轴增长＞0.20 mm）、高度近视期（＞600 度或眼轴＞26 mm）、病理性近视期（定期随访、突变即就医）。没有“恢复期”，近视一旦发生不可逆。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;13&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;近视分期&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c10&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;肥胖&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;课件列出的肥胖敏感期包括：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;胎儿期&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;婴儿期&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;脂肪重聚期（5～7 岁）&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;青春期&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;学龄前期（3～4 岁）&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;]]],&quot;explanation&quot;:[0,&quot;四个敏感期是胎儿期（生长迟缓与巨大儿都增风险）、婴儿期（脂肪细胞增殖第一个快速期）、脂肪重聚期 5～7 岁（提前即预警）、青春期（延续到成年的概率＞70%）。3～4 岁不在其列。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;31&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;肥胖&quot;],[0,&quot;敏感期&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c11&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;近视&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;近视检出率随年龄上升，但学龄的影响比年龄更大。&quot;],&quot;answer&quot;:[1,[[0,&quot;true&quot;]]],&quot;explanation&quot;:[0,&quot;课件的流行特点明确写“学龄的影响比年龄更大”，因为近距离用眼负担主要由学段决定。同一年龄的孩子，年级越高近视率越高，这提示防控要跟着学段加码，而不是只看年龄。所以同一班级里，近视防控的重点应随年级升高而加强。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;14&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;流行特点&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c12&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;近视&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;按近视的公共卫生分期，说明每一期的主要任务。&quot;],&quot;answer&quot;:[1,[[0,&quot;前驱期：远视储备不足，重点是保证日间户外 2 小时、改善读写习惯与采光照明，抓早抓小。发展期：年进展超过 50 度或眼轴增长超过 0.20 mm，是防高度近视的关键期，需加强户外、控制近距离用眼、规范矫正与随访。高度近视期：度数超过 600 度或眼轴超过 26 mm，并发症风险明显升高，重点是定期眼底检查。病理性近视期：定期随访，出现突变（视力骤降、闪光感、飞蚊增多）立即就医。&quot;]]],&quot;explanation&quot;:[0,&quot;四期对应四套动作：前驱期抓环境与行为，发展期控进展，高度近视期查眼底，病理性期处理并发症。分期的意义就在于把“防”和“治”分配到不同阶段。四期的划分依据是眼轴与屈光度，不是裸眼视力，这一点常被忽略。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;13&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;近视分期&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c13&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;肥胖&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述儿童肥胖防控中家庭、学校、医疗机构和政府各自的职责。&quot;],&quot;answer&quot;:[1,[[0,&quot;家庭：养成科学饮食与规律活动习惯，做好体重与生长监测。学校：办好营养健康课堂、改善供餐、保证在校活动时间。医疗机构：加强孕期与儿童体重管理，对肥胖儿童开展干预与随访。政府：普及健康知识、管理食品营销、完善体育设施与政策保障。四方责任中，家庭是行为养成的第一现场，学校是可规模化干预的场所。&quot;]]],&quot;explanation&quot;:[0,&quot;答题按四方各写一条，最后点出分工逻辑：家庭管行为、学校管环境与时间、机构管筛查干预、政府管政策与市场。只写“多方合作”不给分。四方责任里，学校的优势是覆盖全体且可制度化，家庭的优势是日常行为养成。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;36-40&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;肥胖防控&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch08-c14&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;哮喘影响因素（英文题）&quot;],&quot;type&quot;:[0,&quot;english&quot;],&quot;stem&quot;:[0,&quot;Please describe the genetic and environmental factors associated with childhood asthma.&quot;],&quot;answer&quot;:[1,[[0,&quot;哮喘与遗传和环境两方面因素有关。遗传因素：多基因易感、遗传度较高。环境因素：室内与室外过敏原、呼吸道病毒感染、气候变化、空气污染以及某些食物。个体因素：气道高反应性、特应质（atopy）与肥胖也参与发病。&quot;]]],&quot;explanation&quot;:[0,&quot;按 genetic、environmental、individual 三层作答，环境层要写出过敏原、病毒感染、空气污染三类。只写“过敏”会漏掉感染与污染，也答不出遗传度较高的特点。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：24年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/BlGXCsyQJYDkDoDDqdTVVA&quot;]}],[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第九讲 儿童少年常见病&quot;],&quot;page&quot;:[0,&quot;44-59&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;哮喘&quot;],[0,&quot;英文题&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch09-c01&quot;],&quot;chapterKey&quot;:[0,&quot;ch09&quot;],&quot;chapter&quot;:[0,&quot;第九章 儿童少年心理卫生问题&quot;],&quot;section&quot;:[0,&quot;基本概念&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;关于心理卫生（精神卫生），下列说法正确的是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;只研究精神障碍的治疗&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;靠预防、治疗、教育措施，使人能按自己的身心潜能活动&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;与身体健康互不影响&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;只针对学龄期儿童&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;心理卫生是研究如何维护、促进心理健康的科学，靠预防、治疗与教育措施使人能按自身身心潜能活动。课件还强调身体健康是心理健康的基础与前提，心理健康是身体健康的保障与动力。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;儿童少年心理卫生问题&quot;],&quot;page&quot;:[0,&quot;3&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;心理卫生&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch09-c02&quot;],&quot;chapterKey&quot;:[0,&quot;ch09&quot;],&quot;chapter&quot;:[0,&quot;第九章 儿童少年心理卫生问题&quot;],&quot;section&quot;:[0,&quot;基本概念&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;区分“心理卫生问题”与“精神障碍”的关键在于：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;是否出现过同类行为&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;严重程度与持续时间是否超过相应年龄允许的范围&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;是否影响学习成绩&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;是否有家族史&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;心理卫生问题是心理健康方面的偏倚；当严重程度、持续时间超出该年龄允许范围时称精神障碍。界定障碍还要看自身痛苦体验、功能损害、可能进一步加重的损害三项。判断时“是否符合年龄”比“有没有这个行为”更关键。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;儿童少年心理卫生问题&quot;],&quot;page&quot;:[0,&quot;5&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;心理卫生问题&quot;],[0,&quot;精神障碍&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch09-c03&quot;],&quot;chapterKey&quot;:[0,&quot;ch09&quot;],&quot;chapter&quot;:[0,&quot;第九章 儿童少年心理卫生问题&quot;],&quot;section&quot;:[0,&quot;ADHD&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;注意缺陷多动障碍的核心症状是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;活动过多&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;行为冲动&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;注意缺陷&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;学习困难&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;C&quot;]]],&quot;explanation&quot;:[0,&quot;三组表现里，注意缺陷是核心：集中注意困难、“听而不闻视而不见”、丢三落四；活动过多与行为冲动是另两组。学习困难多为继发结果，三年级以后更明显，不是核心症状。如果题干强调“坐不住、爱插话”，考的是活动过多与冲动，不是核心症状。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;儿童少年心理卫生问题&quot;],&quot;page&quot;:[0,&quot;18-19&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;ADHD&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch09-c04&quot;],&quot;chapterKey&quot;:[0,&quot;ch09&quot;],&quot;chapter&quot;:[0,&quot;第九章 儿童少年心理卫生问题&quot;],&quot;section&quot;:[0,&quot;ADHD&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;按 DSM-5，ADHD 诊断要求症状持续时间至少：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;2 周&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;1 个月&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;6 个月&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;2 年&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;C&quot;]]],&quot;explanation&quot;:[0,&quot;DSM-5 要求注意缺陷或多动冲动条目满足 6 条以上（17 岁及以上 5 条）、持续超过 6 个月、12 岁前出现、出现在两个以上环境且明显影响功能，并排除其他精神障碍。单次表现、单一场景不足以诊断。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;儿童少年心理卫生问题&quot;],&quot;page&quot;:[0,&quot;20-21&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;ADHD&quot;],[0,&quot;诊断&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch09-c05&quot;],&quot;chapterKey&quot;:[0,&quot;ch09&quot;],&quot;chapter&quot;:[0,&quot;第九章 儿童少年心理卫生问题&quot;],&quot;section&quot;:[0,&quot;学习障碍&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;学习障碍的判定前提是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;智力明显低于同龄&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;智力正常，无感觉器官与运动功能缺陷&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;有明确的教育剥夺&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;以情绪障碍为原发原因&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;学习障碍是阅读、书写、拼字、表达、计算等基本心理过程中的特殊性障碍，前提是智力正常、无感官与运动缺陷，且困难不能由原发性情绪障碍或教育剥夺解释。这三条排除是它与智力落后、情绪问题鉴别的关键。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;儿童少年心理卫生问题&quot;],&quot;page&quot;:[0,&quot;23&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;学习障碍&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch09-c06&quot;],&quot;chapterKey&quot;:[0,&quot;ch09&quot;],&quot;chapter&quot;:[0,&quot;第九章 儿童少年心理卫生问 t;ch10-c08&quot;],&quot;chapterKey&quot;:[0,&quot;ch10&quot;],&quot;chapter&quot;:[0,&quot;第十章 儿童少年伤害与暴力&quot;],&quot;section&quot;:[0,&quot;基本概念&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;意外伤害是纯粹的偶然事件，没有规律可循，因此难以预防。&quot;],&quot;answer&quot;:[1,[[0,&quot;false&quot;]]],&quot;explanation&quot;:[0,&quot;课件明确写：意外伤害虽是突发事件，但有鲜明的疾病特征、有外部原因和内在发展规律、通过适当措施可有效预防控制。这句话是整章的立论基础；如果伤害纯属偶然，五 E 与 Haddon 模型都无从谈起。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十一章 儿童少年伤害与暴力 2026&quot;],&quot;page&quot;:[0,&quot;8&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;可预防性&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch10-c09&quot;],&quot;chapterKey&quot;:[0,&quot;ch10&quot;],&quot;chapter&quot;:[0,&quot;第十章 儿童少年伤害与暴力&quot;],&quot;section&quot;:[0,&quot;流行&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;全球男性伤害死亡率约为女性的 2 倍。&quot;],&quot;answer&quot;:[1,[[0,&quot;true&quot;]]],&quot;explanation&quot;:[0,&quot;全球男性伤害死亡率约为女性 2 倍，3/4 的道路交通死亡、4/5 的凶杀、9/10 的战争死亡发生在男性。这一差异与行为方式（冒险、攻击性）和社会角色有关，是伤害防控要区分性别的理由。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十一章 儿童少年伤害与暴力 2026&quot;],&quot;page&quot;:[0,&quot;15&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;性别差异&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch10-c10&quot;],&quot;chapterKey&quot;:[0,&quot;ch10&quot;],&quot;chapter&quot;:[0,&quot;第十章 儿童少年伤害与暴力&quot;],&quot;section&quot;:[0,&quot;干预策略&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;用 Haddon 模型分析儿童溺水，并给出各阶段的干预措施。&quot;],&quot;answer&quot;:[1,[[0,&quot;三因素是宿主（儿童及其游泳能力、看护状况）、媒介物（水域、水深、温度）、环境（围栏、警示、看护与文化）。三阶段：发生前加强看护与游泳教育、水塘加装围栏与警示牌、清除积水容器；发生中现场施救、抛投漂浮物、及时心肺复苏；发生后送医救治、康复与事件复盘改进。这样矩阵的每一格都能落一条措施。&quot;]]], ;年龄越小，同一性质活动可以持续的时间越长。&quot;],&quot;answer&quot;:[1,[[0,&quot;false&quot;]]],&quot;explanation&quot;:[0,&quot;镶嵌式活动说明皮质兴奋与抑制区随活动性质轮换，年龄越小同一性质活动时间应越短、轮换越频繁。这条规律直接决定了低年级课时短、活动切换多，与“越小越能坐得住”的直觉相反。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十五章 教育过程卫生 2026&quot;],&quot;page&quot;:[0,&quot;18-19&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;镶嵌式活动&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch11-c11&quot;],&quot;chapterKey&quot;:[0,&quot;ch11&quot;],&quot;chapter&quot;:[0,&quot;第十一章 教育过程卫生&quot;],&quot;section&quot;:[0,&quot;作息制度&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;用皮质功能特性解释学校课表编排的基本原则。&quot;],&quot;answer&quot;:[1,[[0,&quot;始动调节：学期、学周、学日之初难度强度不宜过大，要逐步增强。优势法则：明确学习目的、激发兴趣、减少无关刺激，使优势兴奋灶稳定。镶嵌式活动：不同性质课程交替，脑力与体力交替，年龄越小轮换越频繁。动力定型：作息时间固定，不轻易改变。保护性抑制：出现早期疲劳就安排休息，不用“再坚持”硬撑。终末激发：可在课末安排小结，利用一过性兴奋。&quot;]]],&quot;explanation&quot;:[0,&quot;每条特性配一条做法才完整：始动调节对“渐进”、镶嵌式对“交替”、动力定型对“固定”、保护性抑制对“及时休息”。只罗列六条名词不解释对应做法，得分有限。优势法则要配“明确目的、激发兴趣、减少干扰”，这一条最容易被漏写。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十五章 教育过程卫生 2026&quot;],&quot;page&quot;:[0,&quot;11-21&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;课表编排&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch12-c01&quot;],&quot;chapterKey&quot;:[0,&quot;ch12&quot;],&quot;chapter&quot;:[0,&quot;第十二章 学校教学设施与设备卫生&quot;],&quot;section&quot;:[0,&quot;采光&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;教室玻地面积比的卫生要求是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;≥1:3&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;≥1:5&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;≥1:7&quot;]}],[0,{
