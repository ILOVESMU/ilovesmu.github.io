,&quot;page&quot;:[0,&quot;76&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;椅座距离&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch12-c07&quot;],&quot;chapterKey&quot;:[0,&quot;ch12&quot;],&quot;chapter&quot;:[0,&quot;第十二章 学校教学设施与设备卫生&quot;],&quot;section&quot;:[0,&quot;采光&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;评价教室自然采光的指标包括：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;玻地面积比&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;室深系数&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;投射角&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;开角&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;噪声级&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;]]],&quot;explanation&quot;:[0,&quot;采光指标是玻地比、室深系数、投射角、开角、采光系数。投射角看能否看见天空（≥20°～22°），开角看对面遮挡物（≥4°～5°）。噪声级属物理环境指标，不属采光。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十六章 学校教学设施和设备卫生&quot;],&quot;page&quot;:[0,&quot;48-52&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;采光指标&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch12-c08&quot;],&quot;chapterKey&quot;:[0,&quot;ch12&quot;],&quot;chapter&quot;:[0,&quot;第十二章 学校教学设施与设备卫生&quot;],&quot;section&quot;:[0,&quot;采光&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;教室的投射角应不小于 20°～22°。&quot;],&quot;answer&quot;:[1,[[0,&quot;true&quot;]]],&quot;explanation&quot;:[0,&quot;投射角是室内工作面一点到窗侧的水平线，与该点到窗上缘连线的夹角，反映能否看到天空，要求不小于 20°～22°；开角要求不小于 4°～5°。课件原文写作“200~220”，是上标丢失，按角度读。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十六章 学校教学设施和设备卫生&quot;],&quot;page&quot;:[0,&quot;50&quot;]}]]],&quot;discrepancy&quot;:[0,{&quot;status&quot;:[0,&quot;courseware_only&quot;],&quot;courseware&quot;:[0,&quot;p33 原文“不小于 200~220”“不小于 40~50”，上标丢失&quot;],&quot;note&quot;:[0,&quot;按学科惯例读作 20°～22° 与 4°～5°；课件排版为角度上标缺失，非数值 200~220。&quot;]}],&quot;tags&quot;:[1,[[0,&quot;投射角&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch12-c09&quot;],&quot;chapterKey&quot;:[0,&quot;ch12&quot;],&quot;chapter&quot;:[0,&quot;第十二章 学校教学设施与设备卫生&quot;],&quot;section&quot;:[0,&quot;课桌椅&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述课桌椅功能尺寸的主要卫生要求。&quot;],&quot;answer&quot;:[1,[[0,&quot;椅高＝腓骨头点高或再低 1 cm；桌椅高差＝坐高的 1/3（青少年再加 1～2.5 cm）；桌下空区高度不超过桌椅高差的 1/2；桌面可做 10°～12° 斜面；椅深使大腿后 2/3～3/4 落在椅面，靠背后倾 5°～10°；椅座距离以 4 cm 以内的负距离为好，椅靠距离胸前留 3～5 cm。&quot;]]],&quot;explanation&quot;:[0,&quot;按“椅高—高差—桌下空区—桌面—椅深靠背—距离”的顺序写，六个数字一个都不能少。高差太大易脊柱侧弯、太小易脊柱前弯，这句因果常作为简答的收尾。功能尺寸要与型号匹配，教室可预置 1～3 种型号，矮前高后安排。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十六章 学校教学设施和设备卫生&quot;],&quot;page&quot;:[0,&quot;76&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;课桌椅&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch12-c10&quot;],&quot;chapterKey&quot;:[0,&quot;ch12&quot;],&quot;chapter&quot;:[0,&quot;第十二章 学校教学设施与设备卫生&quot;],&quot;section&quot;:[0,&quot;采光&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;教室自然采光的卫生要求有哪些？&quot;],&quot;answer&quot;:[1,[[0,&quot;课桌面与黑板有足够照度且分布均匀；单侧采光从左侧射入，双侧采光也应以主窗在左；避免强眩光。指标上要求玻地面积比 ≥1:5、室深系数单侧 ≥1:2（双侧 ≥1:4）、投射角 ≥20°～22°、开角 ≥4°～5°、课桌面采光系数 ≥2%。窗户用无色透明玻璃并保持清洁。&quot;]]],&quot;explanation&quot;:[0,&quot;答题分两层：定性要求（足够、均匀、左侧、防眩光）与定量指标（五个数字）。只写“采光要好”没有分，只背数字不写方向（左侧射入）也会丢分。五个指标分别对应够不够亮、进深大不大、能不能看天、挡不挡、相对亮度。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&qu ;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;树立健康意识、培养良好行为&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;改造学校物理环境&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;提高学业成绩&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;健康教育通过有计划的健康信息传播与行为干预，使人掌握知识、树立观念、自觉采纳健康行为，核心目标是树立健康意识与培养良好行为。治疗属临床，改造环境属健康促进中的环境支持。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十七章 学校健康教育与健康促进&quot;],&quot;page&quot;:[0,&quot;8&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;健康教育&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch13-c02&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;基本概念&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;与健康教育相比，健康促进额外强调的是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;知识传播&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;环境支持，使行为改变成为可能&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;疾病治疗&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;体格检查&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;健康促进是“促使行为和生活条件向有益健康改变的教育和环境支持的综合体”，环境包括社会、政治、经济、自然。学校禁烟、食堂供餐标准、课桌椅高度都属健康促进——它们改变的是“改得动”的条件，不只是知识。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十七章 学校健康教育与健康促进&quot;],&quot;page&quot;:[0,&quot;11&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;健康促进&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch13-c03&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;健康素养&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;《中国公民健康素养（2015 年版）》共有多少条？&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;56 条&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;66 条&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;76 条&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;86 条&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;共 66 条，分三方面：基本知识和理念、健康生活方式与行为、基本健康技能。健康素养的四个维度是知识性、行为性、信念性、功能性，与这 66 条一起构成常考组合。健康素养不是知识测验，重点在“能不能用信息做判断”。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十七章 学校健康教育与健康促进&quot;],&quot;page&quot;:[0,&quot;15&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;健康素养&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch13-c04&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;规划模式&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;PRECEDE-PROCEED 模式的第 1 步是：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;流行病学评价&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;社会评价&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;教育生态评价&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;实施&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;]]],&quot;explanation&quot;:[0,&quot;八步顺序是社会评价→流行病学评价→教育生态评价→行政与政策评价→实施→过程评估→影响评估→结果评估。第 1 步一定是社会评价，先看人群的需求与生活质量，而不是先查发病率。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十七章 学校健康教育与健康促进&quot;],&quot;page&quot;:[0,&quot;41-43&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;PRE quot;]]],&quot;explanation&quot;:[0,&quot;五个特征是利弊性（有利性）、规律性、和谐性、内外一致、强度适宜。E 错在“越大越好”——强度要适宜，过度运动、过度节食同样损害健康，这与“促进健康”的定义相反。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十七章 学校健康教育与健康促进&quot;],&quot;page&quot;:[0,&quot;12-13&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;健康行为&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch13-c07&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;教学方法&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;下列属于参与式教学方法的有：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;小组讨论与案例分析&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;头脑风暴&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;角色扮演&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;同伴教育&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;课堂讲授&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;]]],&quot;explanation&quot;:[0,&quot;参与式以学生为主体，包括小组讨论、案例分析、头脑风暴、角色扮演、辩论演讲、同伴教育。课堂讲授属传统式，系统性强但学生参与度低；两者不是优劣关系，而是适配不同内容。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十七章 学校健康教育与健康促进&quot;],&quot;page&quot;:[0,&quot;22-24&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;教学方法&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch13-c08&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;生活技能&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;生活技能教育培养的心理社会能力包括：&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;自我认识与同理&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;有效交流与人际关系&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;调节情绪与缓解压力&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;创造性思维与批判性思维&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;背诵与记忆&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;]]],&quot;explanation&quot;:[0,&quot;十种能力配成五对：自我认识—同理、有效交流—人际关系、调节情绪—缓解压力、创造性思维—批判性思维、决策—解决问题。背诵记忆属学习策略，不是心理社会能力。五对能力覆盖自我、他人、情绪、认知与决策，是生活技能教育的内容框架。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十七章 学校健康教育与健康促进&quot;],&quot;page&quot;:[0,&quot;29-30&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;生活技能&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch13-c09&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;健康促进学校&quot;],&quot;type&quot;:[0,&quot;true_false&quot;],&quot;stem&quot;:[0,&quot;健康促进学校只要开设健康课程、把知识讲清楚就够了。&quot;],&quot;answer&quot;:[1,[[0,&quot;false&quot;]]],&quot;explanation&quot;:[0,&quot;健康促进学校（WS/T 495-2016）要求全校成员共同维护师生健康、制定健康规章制度、提供完整知识结构、设置正式与非正式健康课程、创造安全健康环境、提供适宜健康服务。只讲课程，缺的正是“环境支持”这一半。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十七章 学校健康教育与健康促进&quot;],&quot;page&quot;:[0,&quot;14&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;健康促进学校&quot;]]],&quot;difficulty&quot;:[0,&quot;basic&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch13-c10&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;规划模式&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述 PRECEDE-PROCEED 模式的八个阶段，并说明为什么按这个顺序。&quot;],&quot;answer&quot;:[1,[[0,&quot;八阶段：社会评价、流行病学评价、教育生态评价、行政与政策评价、实施、过程评估、影响评估、结果评估。前四步属 PRECEDE（诊断），后四步属 PROCEED（执行与评价）。顺序的逻辑是先确定人群需求与生活质量目标，再用流行病学确定优先问题，再诊断倾向、强化、促成三类因素，然后评估政策与资源，才进入实施与三级评价。&quot;]]],&quot;explanation&quot;:[0,&quot;答题要写全八步并分成“诊断四步＋执行评价四步”。顺序的意义在于：不先做社会评价就定项目，容易做成“专家觉得重要但人群不需要”的干预。PRECEDE 四步是诊断、PROCEED 四步是执行与评价，这个划分要能一口说出。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十七章 学校健康教育与健康促进&quot;],&quot;page&quot;:[0,&quot;41-43&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;PRECEDE-PROCEED&quot;]]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;ch13-c11&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;教学方法&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述学校健康教育的三类教学方法及其适用场景。&quot;],&quot;answer&quot;:[1,[[0,&quot;传统式：课堂讲授、讲座、示教，适合系统传授知识、演示操作技能。参与式：小组讨论与案例分析、头脑风暴、角色扮演、辩论演讲、同伴教育，适合态度转变、技能训练与敏感话题。间接式：大众媒体、视听教具、网络学习，适合扩大覆盖面与营造氛围。选择时按内容类型定：知识用讲授，技能用示教与角色扮演，态度用讨论与辩论，敏感话题用同伴教育。&quot;]]],&quot;explanation&quot;:[0,&quot;三类各写方法与适用场景，最后给出“按内容类型选方法”的判断规则。只列方法名不写适用场景，简答题会丢一半分。补充一句：同一主题常需多种方法组合，单用讲授难以改变行为。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;第十七章 学校健康教育与健康促进&quot;],&quot;page&quot;:[0,&quot;22-24&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;教学方法&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0]}],[0,{&quot;id&quot;:[0,&quot;quiz1-01&quot;],&quot;chapterKey&quot;:[0,&quot;ch01&quot;],&quot;chapter&quot;:[0,&quot;第一章 儿童少年生长发育&quot;],&quot;section&quot;:[0,&quot;爱课测验原题&quot;],&quot;type&quot;:[0,&quot;single&quot;],&quot;stem&quot;:[0,&quot;人体身高体重增长速度最快的阶段是？（ ）&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&q &quot;:[0,&quot;学生使用电脑时姿势正确的是&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;头颈部宜保持正直或略微前倾，眼睛到屏面的水平距离不小于 70cm&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;手腕自然舒展，与前臂形成一条直线&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;使用键盘打字时宜采用正直姿势，使用鼠标浏览屏面时宜采用后位坐姿&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;肩部放松，肘屈角度等于或略大于 90 度&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;膝屈角度等于或略大于 90 度&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;],[0,&quot;E&quot;]]],&quot;explanation&quot;:[0,&quot;电脑使用姿势要求手腕自然、键盘正直、鼠标后位坐姿、肩部放松、肘膝约90°；A项不是题库答案。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;儿童少年卫生学小测（孙素霞）&quot;],&quot;page&quot;:[0,&quot;爱课测验&quot;]}],[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;学校教学设施与设备卫生&quot;],&quot;chapter&quot;:[0,&quot;采光照明、课桌椅与校址&quot;]}],[0,{&quot;type&quot;:[0,&quot;textbook&quot;],&quot;title&quot;:[0,&quot;儿童少年卫生学（第9版）&quot;],&quot;chapter&quot;:[0,&quot;第十六章 学校教学设施与设备卫生&quot;]}]]],&quot;discrepancy&quot;:[0,{&quot;status&quot;:[0,&quot;flawed&quot;],&quot;note&quot;:[0,&quot;题库答案排除了A。A的前半句“头颈部正直或略前倾”符合一般电脑姿势要求，但“眼睛到屏面水平距离不小于70cm”等细节可能不符合课件口径，建议对照课件核实。&quot;]}],&quot;tags&quot;:[1,[[0,&quot;爱课测验&quot;],[0,&quot;原题&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0,&quot;电脑姿势记手腕直、键盘正、鼠标后位坐姿、肩放松、肘膝约90°。本题答案取 B、C、D、E，A的头颈距离与课件口径不一致。&quot;]}],[0,{&quot;id&quot;:[0,&quot;quiz3-30&quot;],&quot;chapterKey&quot;:[0,&quot;ch11&quot;],&quot;chapter&quot;:[0,&quot;第十一章 教育过程卫生&quot;],&quot;section&quot;:[0,&quot;爱课测验原题&quot;],&quot;type&quot;:[0,&quot;multiple&quot;],&quot;stem&quot;:[0,&quot;大脑皮质的功能活动特性包括哪些&quot;],&quot;options&quot;:[1,[[0,{&quot;key&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;终末激发&quot;]}],[0,{&quot;key&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;始动调节&quot;]}],[0,{&quot;key&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;保护性抑制&quot;]}],[0,{&quot;key&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;动力定型&quot;]}],[0,{&quot;key&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;优势法则&quot;]}]]],&quot;answer&quot;:[1,[[0,&quot;A&quot;],[0,&quot;B&quot;],[0,&quot;C&quot;],[0,&quot;D&quot;],[0,&quot;E&quot;]]],&quot;explanation&quot;:[0,&quot;大脑皮质功能活动特性包括始动调节、优势法则、动力定型、保护性抑制和终末激发。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;儿童少年卫生学小测（孙素霞）&quot;],&quot;page&quot;:[0,&quot;爱课测验&quot;]}],[0,{&quot;type&quot;:[0,&quot;courseware&quot;],&quot;title&quot;:[0,&quot;教育过程卫生&quot;],&quot;chapter&quot;:[0,&quot;脑力工作能力、疲劳与作息&quot;]}],[0,{&quot;type&quot;:[0,&quot;textbook&quot;],&quot;title&quot;:[0,&quot;儿童少年卫生学（第9版）&quot;],&quot;chapter&quot;:[0,&quot;第十五章 教育过程卫生&quot;]}]]],&quot;discrepancy&quot;:[0,null],&quot;tags&quot;:[1,[[0,&quot;爱课测验&quot;],[0,&quot;原题&quot;]]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0,&quot;大脑皮质五个特性：始动调节、优势法则、动力定型、保护性抑制、终末激发。按一天的学习过程串起来。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2022-01&quot;],&quot;chapterKey&quot;:[0,&quot;ch10&quot;],&quot;chapter&quot;:[0,&quot;第十章 儿童少年伤害与暴力&quot;],&quot;section&quot;:[0,&quot;Haddon 模型&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;以交通事故或溺水为例，建立 Haddon 模型。&quot;],&quot;answer&quot;:[1,[[0,&quot;以交通事故为例：宿主是儿童及其年龄、行为、视听觉和运动能力；媒介物是车辆、道路和交通设施；环境是道路条件、交通规则、天气和社会管理。发生前可采取限速、道路分隔、安全教育和佩戴头盔；发生中可使用安全带、儿童安全座椅和头盔，减少碰撞能量传递；发生后可进行现场急救、转运、康复和事故调查。&quot;]]],&quot;explanation&quot;:[0,&quot;答题时先写出三因素（宿主、媒介物、环境）和三阶段（发生前、发生中、发生后），再各举 1～2 个措施。以溺水为例，宿主是儿童，媒介物是水域，环境是看护、围栏和警示；发生前加强看护和游泳教育，发生中施救和心肺复苏，发生后康复和事件复盘。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：22年儿少卫生（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/fOw8227094lKra21zO98AQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2022&quot;]]],&quot;note&quot;:[0,&quot;公众号考试回忆版，原题表述可能略有差异。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;这题我建议先在草稿纸上画表。横着三个时间，竖着三个因素，空着也没关系，画出来以后人、物、场就不会漏。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2022-02&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 健康问题、健康状况与健康促进策略&quot;],&quot;section&quot;:[0,&quot;生命历程&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;“饥饿实验”涉及轨迹现象、DOHaD 理论和生命初始 1000 天，请说明它们之间的联系。&quot;],&quot;answer&quot;:[1,[[0,&quot;早期饥饿或营养不良会使个体暂时偏离原有生长轨迹；环境改善后可出现追赶性生长，体现生长轨迹现象。若不利暴露发生在胎儿期和婴幼儿期，可能通过程序性改变影响成年期代谢和慢性病风险，这是 DOHaD 理论。生命初始 1000 天从怀孕到出生后 2 岁，是预防成年慢性病的重要窗口。&quot;]]],&quot;explanation&quot;:[0,&quot;三个关键词要分开解释再联系：轨迹现象强调生长有既定方向；追赶生长强调阻碍解除后的加速；DOHaD 强调早期暴露与成年疾病的长期关联；1000 天是干预窗口。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：22年儿少卫生（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/fOw8227094lKra21zO98AQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2022&quot;]]],&quot;note&quot;:[0,&quot;公众号考试回忆版。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;饥饿把生长压慢，条件改善后出现追赶。若发生在胎儿期和两岁前，按 DOHaD 的说法，成年后的代谢风险也可能被改写。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2022-03&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;组织改变理论&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;运用组织改变理论，安排一次戒烟干预活动。&quot;],&quot;answer&quot;:[1,[[0,&quot;按解冻、改变、再冻结三阶段设计。解冻：调查学校吸烟现状和需求，让师生认识到吸烟危害和干预必要性，争取校领导支持。改变：开展健康教育课、同伴教育、戒烟小组、无烟校园环境建设，提供戒烟咨询和替代活动。再冻结：把无烟制度、巡查、奖励和年度活动写入校规，持续监测并反馈。&quot;]]],&quot;explanation&quot;:[0,&quot;答题结构是“诊断需求—形成改变动力—实施多层面干预—制度化维持”，并说明评价指标，如吸烟率、尝试戒烟人数、无烟环境达标率。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：22年儿少卫生（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/fOw8227094lKra21zO98AQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2022&quot;],[0,&quot;2023&quot;],[0,&quot;2024&quot;]]],&quot;note&quot;:[0,&quot;22、23、24 年回忆题均出现“组织改变理论+戒烟干预”类题目。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;戒烟题别只写劝。先让学校觉得必须改（解冻），再落实课程、同伴支持、戒烟小组和无烟环境（改变），最后用制度、巡查和评价固定下来（再冻结）。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2022-04&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;哮喘&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述哮喘发生的影响因素。&quot;],&quot;answer&quot;:[1,[[0,&quot;遗传因素：哮喘具有多基因遗传倾向，遗传度较高。环境因素：室内外变应原、呼吸道病毒感染、气候变化、空气污染、食物和运动等。个体因素：气道高反应性、过敏体质和肥胖等也可增加风险。&quot;]]],&quot;explanation&quot;:[0,&quot;先分遗传和环境，再补个体因素；呼吸道病毒感染是引起气道高反应性的重要原因。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：22年儿少卫生（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/fOw8227094lKra21zO98AQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2022&quot;],[0,&quot;2024&quot;]]],&quot;note&quot;:[0,&quot;24 年以英文题形式出现。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0,&quot;哮喘先写遗传底子，再写环境诱因。过敏体质、气道高反应是底子，病毒感染、过敏原、空气污染和气候变化是点火的东西。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2022-05&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;Scammon 生长模式&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述 Scammon 生长模式。&quot;],&quot;answer&quot;:[1,[[0,&quot;Scammon 把组织器官生长分为四型：一般型（肌肉、骨骼、主要脏器）生后第一年增长最快，青春期再次突增；神经系统型（脑、脊髓、视觉器官、头围）只有一个突增期，主要在胎儿期至 6 岁前；淋巴系统型（胸腺、淋巴结）头 10 年迅速增长，12 岁左右达成人约 200% 后萎缩；生殖系统型前 10 年几乎不发展，青春期后迅速生长。&quot;]]],&quot;explanation&quot;:[0,&quot;答题时写出四型名称、代表器官和曲线特点；题目要求英文时可写 general、neural、lymphoid、genital。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：22年儿少卫生（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/fOw8227094lKra21zO98AQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2022&quot;],[0,&quot;2023&quot;]]],&quot;note&quot;:[0,&quot;23 年要求英文表述。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0,&quot;四条曲线分开记：一般型跟身高体重走，神经型6岁前冲完，淋巴型12岁到两倍再退，生殖型青春期才启动。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2022-06&quot;],&quot;chapterKey&quot;:[0,&quot;ch06&quot;],&quot;chapter&quot;:[0,&quot;第六章 生长发育调查与评价&quot;],&quot;section&quot;:[0,&quot;百分位数法&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述百分位数法评价生长发育水平的过程和优缺点。&quot;],&quot;answer&quot;:[1,[[0,&quot;把同性别、同年龄儿童的某指标测量值从小到大排列，计算 P3、P10、P25、P50、P75、P90、P97 等百分位界值，再把个体测量值落入相应百分位区间，判断其在该人群中的位置。优点是直观、易解释、不受正态分布限制；缺点是不能直接给出标准差单位，界值受样本代表性影响，也不能反映个体生长速度。&quot;]]],&quot;explanation&quot;:[0,&quot;先讲排序和界值，再讲个体定位，最后写优缺点。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：22年儿少卫生（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/fOw8227094lKra21zO98AQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2022&quot;]]],&quot;note&quot;:[0,&quot;公众号考试回忆版。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0,&quot;百分位法就是把同年龄同性别的孩子从矮到高排队，看他站在第几百分位。直观，但只能说现在的位置，不能直接说长得多快。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2023-01&quot;],&quot;chapterKey&quot;:[0,&quot;ch02&quot;],&quot;chapter&quot;:[0,&quot;第二章 儿童少年身体发育&quot;],&quot;section&quot;:[0,&quot;Scammon 生长模式&quot;],&quot;type&quot;:[0,&quot;english&quot;],&quot;stem&quot;:[0,&quot;Please describe Scammon&#39;s growth patterns.&quot;],&quot;answer&quot;:[1,[[0,&quot;Scammon described four growth patterns: general type (muscle, bone and major viscera), which grows fastest in the first postnatal year and has a second spurt at puberty; neural type (brain, spinal cord, visual organs and head circumference), which has only one spurt mainly from fetal life to about 6 years; lymphoid type (thymus and lymph nodes), which grows rapidly in the first 10 years, reaches about 200% of adult size around 12 years and then involutes; and genital type, which shows little growth in the first 10 years and grows rapidly after puberty.&quot;]]],&quot;explanation&quot;:[0,&quot;英文答题要写出 four types、代表器官和曲线特点；注意 neural type 只有一个突增期。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：23年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/tYprl3obA7DbUP1ac7tulQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2023&quot;]]],&quot;note&quot;:[0,&quot;英文简答题。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;英文题先把四个词写对：general、neural、lymphoid、genital。neural 只有一个突增期，lymphoid 会超过成人再退。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2023-02&quot;],&quot;chapterKey&quot;:[0,&quot;ch01&quot;],&quot;chapter&quot;:[0,&quot;第一章 儿童少年生长发育&quot;],&quot;section&quot;:[0,&quot;追赶性生长&quot;],&quot;type&quot;:[0,&quot;english&quot;],&quot;stem&quot;:[0,&quot;结合案例简述什么是追赶性生长，及其对儿童生长发育的影响（英文）。&quot;],&quot;answer&quot;:[1,[[0,&quot;Catch-up growth is the accelerated growth that occurs after the factors causing temporary growth retardation, such as illness, malnutrition or psychological stress, are removed. The child tends to return toward the original growth trajectory. It is stronger at younger ages. Adequate catch-up can restore growth, but excessive or poorly timed catch-up, especially in early life, may be associated with later metabolic risk.&quot;]]],&quot;explanation&quot;:[0,&quot;英文答题要包含定义、机制、年龄特点和影响；可结合营养不良儿童恢复饮食后的加速生长案例。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：23年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/tYprl3obA7DbUP1ac7tulQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2023&quot;]]],&quot;note&quot;:[0,&quot;英文简答题。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;catch-up growth 是暂时落后后的加速追赶。年龄越小通常越明显，但追得太快也可能有代谢代价。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2023-03&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;组织改变理论&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;运用组织改变理论安排一次戒烟干预活动。&quot;],&quot;answer&quot;:[1,[[0,&quot;按解冻、改变、再冻结设计。解冻阶段做需求评估、宣传吸烟危害、争取学校支持；改变阶段开展健康教育、同伴教育、戒烟小组、无烟环境建设和戒烟服务；再冻结阶段把无烟制度、巡查、奖励和年度评估制度化。&quot;]]],&quot;explanation&quot;:[0,&quot;与 22 年同类题答题框架一致，注意写出组织层面的制度与环境改变，而不只是个人劝告。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：23年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/tYprl3obA7DbUP1ac7tulQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2022&quot;],[0,&quot;2023&quot;],[0,&quot;2024&quot;]]],&quot;note&quot;:[0,&quot;重复出现的简答题。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;还是解冻、改变、再冻结。先让学校觉得非改不可，再落课程、同伴支持和无烟环境，最后把制度、巡查、奖励和评价钉住。只劝个人不算组织改变。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2023-04&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 健康问题、健康状况与健康促进策略&quot;],&quot;section&quot;:[0,&quot;主要健康问题&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述目前我国儿童少年的主要健康问题。&quot;],&quot;answer&quot;:[1,[[0,&quot;近视形势严峻且低龄化；超重肥胖率持续上升；营养不足和营养缺乏仍然存在；心理行为问题日益突出；伤害是重要死因；慢性病低龄化；传染病仍持续威胁。还可提到流动儿童和留守儿童等特殊群体的健康问题。&quot;]]],&quot;explanation&quot;:[0,&quot;按“营养—视力—心理—伤害—慢性病—传染病—特殊群体”组织答案，覆盖面更完整。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：23年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/tYprl3obA7DbUP1ac7tulQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2023&quot;]]],&quot;note&quot;:[0,&quot;公众号考试回忆版。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0,&quot;主要健康问题答题时按类抓：营养、视力、心理、伤害、慢性病、传染病、特殊群体。特殊群体最容易被漏。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2023-05&quot;],&quot;chapterKey&quot;:[0,&quot;ch11&quot;],&quot;chapter&quot;:[0,&quot;第十一章 教育过程卫生&quot;],&quot;section&quot;:[0,&quot;疲劳&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;学生生理负荷达到临界限度的指标是什么？疲劳、疲倦和过劳三者是什么关系？&quot;],&quot;answer&quot;:[1,[[0,&quot;题库答案是早期疲劳。疲劳是工作能力下降的生理状态；疲倦是主观感受，可能先于或晚于疲劳出现；过劳是长期疲劳积累，休息后也不能完全恢复。三者由轻到重、由生理到主观再到慢性积累。&quot;]]],&quot;explanation&quot;:[0,&quot;先给“早期疲劳”这个指标，再分别解释三个概念，最后说明递进关系。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：23年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/tYprl3obA7DbUP1ac7tulQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2023&quot;]]],&quot;note&quot;:[0,&quot;公众号考试回忆版。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0,&quot;疲劳是身体状态，疲倦是主观感受，过劳是长期积累。题目问临界指标，选早期疲劳。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2023-06&quot;],&quot;chapterKey&quot;:[0,&quot;ch07&quot;],&quot;chapter&quot;:[0,&quot;第七章 健康问题、健康状况与健康促进策略&quot;],&quot;section&quot;:[0,&quot;DOHaD&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;孕妇遭遇饥荒，孩子出生体重高于平均水平，成年后甘油三酯、低密度脂蛋白升高，糖尿病、肥胖和高血压风险增加。请用儿少卫生理论解释并提出预防启示。&quot;],&quot;answer&quot;:[1,[[0,&quot;可用 DOHaD 理论、生命初始 1000 天和全生命周期保健解释。早期营养不良或营养失衡可使胎儿组织器官发生程序性改变，出现“节约型表型”；出生后若营养供应改善甚至过剩，早期预测与实际环境不匹配，成年后更容易出现肥胖、血脂异常、糖尿病和高血压。预防启示是把健康关口前移，重视孕前、孕期和婴幼儿营养，避免早期营养不良和出生后过度追赶，开展全生命周期监测和家庭—学校—社区综合干预。&quot;]]],&quot;explanation&quot;:[0,&quot;论述题结构：先亮理论，再用理论解释现象，最后落到三级预防和生命早期干预。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：23年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/tYprl3obA7DbUP1ac7tulQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2023&quot;]]],&quot;note&quot;:[0,&quot;论述题。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;饥荒年代的胎儿会调整代谢，出生后如果突然高油高糖，原来的适应反而增加肥胖和代谢病风险。所以预防要看孕前、孕期和两岁前。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2023-07&quot;],&quot;chapterKey&quot;:[0,&quot;ch06&quot;],&quot;chapter&quot;:[0,&quot;第六章 生长发育调查与评价&quot;],&quot;section&quot;:[0,&quot;评价方法&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;比较 A、B 两所学校学生身高发育水平是否有差异，请选择一种评价方法，说明过程、优缺点。&quot;],&quot;answer&quot;:[1,[[0,&quot;可选择 Z 标准差法或百分位数法。以 Z 分为例：按性别、年龄分层，使用同一参考标准计算每名学生的身高 Z 分，比较两校 Z 分均值和分布，并做统计检验。优点是能跨年龄、跨性别比较，适合群体差异分析；缺点是对参考标准依赖较大，不能直接反映个体生长速度。百分位数法更直观，但同样不能反映速度。&quot;]]],&quot;explanation&quot;:[0,&quot;先说明分层和参考标准，再讲计算与比较，最后写优缺点；不要只写“做 t 检验”。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：23年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/tYprl3obA7DbUP1ac7tulQ&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2023&quot;]]],&quot;note&quot;:[0,&quot;论述题。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;比较两校身高，先同性别同年龄分层，再算均值、Z 分或百分位，最后比较分布。直接上 t 检验，前面该做的描述就漏了。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2024-01&quot;],&quot;chapterKey&quot;:[0,&quot;ch04&quot;],&quot;chapter&quot;:[0,&quot;第四章 青春期生长发育&quot;],&quot;section&quot;:[0,&quot;青春期概念&quot;],&quot;type&quot;:[0,&quot;english&quot;],&quot;stem&quot;:[0,&quot;Please explain the definition of puberty and puberty timing.&quot;],&quot;answer&quot;:[1,[[0,&quot;Puberty is the biological process of reproductive system development and maturation during early adolescence, usually lasting about 4.5 years. Puberty timing refers to the age and sequence pattern in which pubertal events such as growth spurt, breast development, pubic hair growth and menarche occur.&quot;]]],&quot;explanation&quot;:[0,&quot;英文答题要区分 puberty（生殖系统成熟的生物学过程）和 puberty timing（各事件出现的时间模式）。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：24年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/BlGXCsyQJYDkDoDDqdTVVA&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2024&quot;]]],&quot;note&quot;:[0,&quot;英文简答题。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;puberty 是过程，puberty timing 是这个过程什么时候开始、按什么顺序发生。英文题问 timing，答案里要有时间模式。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2024-02&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;哮喘&quot;],&quot;type&quot;:[0,&quot;english&quot;],&quot;stem&quot;:[0,&quot;Please describe the factors associated with asthma.&quot;],&quot;answer&quot;:[1,[[0,&quot;Asthma is influenced by genetic and environmental factors. Genetic factors include polygenic susceptibility and a relatively high heritability. Environmental factors include indoor and outdoor allergens, respiratory viral infections, climate change, air pollution and certain foods. Individual factors such as airway hyperresponsiveness, atopy and obesity also contribute.&quot;]]],&quot;explanation&quot;:[0,&quot;英文作答按 genetic、environmental、individual 三层组织。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：24年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/BlGXCsyQJYDkDoDDqdTVVA&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2024&quot;]]],&quot;note&quot;:[0,&quot;英文简答题。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;可以写成三层：基因给易感底子，环境负责触发，个体因素（肥胖、气道高反应等）再加一把。三层都写，答案就完整。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2024-03&quot;],&quot;chapterKey&quot;:[0,&quot;ch09&quot;],&quot;chapter&quot;:[0,&quot;第九章 儿童少年心理卫生问题&quot;],&quot;section&quot;:[0,&quot;自伤&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;14 岁女孩经历家庭结构变化和疫情分离后出现情绪低落、对弟弟发脾气、身上有划痕和割伤。请分析其自伤行为。&quot;],&quot;answer&quot;:[1,[[0,&quot;需要从生物-心理-社会角度评估。她处于青春期，情绪两极性明显；家庭结构变化、二孩出生、主要照护者离开和疫情隔离可能造成被忽视感、依恋不安全、亲子冲突和同伴支持不足。划痕和割伤提示自伤，应评估抑郁、焦虑、自杀意念、睡眠和学校适应。处置上先保证安全，进行危机评估和心理支持，联合家庭和学校，必要时转介精神卫生专业机构。&quot;]]],&quot;explanation&quot;:[0,&quot;案例分析要写出风险因素、保护因素、评估内容和转介原则；不要把自伤简单归因于“叛逆”。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：24年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/BlGXCsyQJYDkDoDDqdTVVA&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2024&quot;]]],&quot;note&quot;:[0,&quot;案例分析题。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;案例题先看安全，再看风险。情绪问题、家庭变化、被忽视感可能叠在一起，划痕是信号，不要只用“叛逆”解释。必要时转介。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2024-04&quot;],&quot;chapterKey&quot;:[0,&quot;ch13&quot;],&quot;chapter&quot;:[0,&quot;第十三章 学校健康教育与健康促进&quot;],&quot;section&quot;:[0,&quot;组织改变理论&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;运用组织改变理论安排一场戒烟干预活动。&quot;],&quot;answer&quot;:[1,[[0,&quot;解冻：评估学校吸烟现状，宣传危害，争取领导和教师支持。改变：开设健康教育课，开展同伴教育、戒烟小组和无烟校园活动，提供戒烟咨询。再冻结：把无烟制度、巡查、奖励和年度评价固定下来，持续监测吸烟率和无烟环境达标率。&quot;]]],&quot;explanation&quot;:[0,&quot;与往年重复题一致，答题要覆盖组织层面的制度、环境和持续机制。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：24年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/BlGXCsyQJYDkDoDDqdTVVA&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2022&quot;],[0,&quot;2023&quot;],[0,&quot;2024&quot;]]],&quot;note&quot;:[0,&quot;高频重复题。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;还是解冻、改变、再冻结。冻结阶段要写制度、巡查、奖励和评价，别只写一次讲座。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2024-05&quot;],&quot;chapterKey&quot;:[0,&quot;ch08&quot;],&quot;chapter&quot;:[0,&quot;第八章 儿童少年常见病&quot;],&quot;section&quot;:[0,&quot;肥胖&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;简述肥胖的易感环境和表现。&quot;],&quot;answer&quot;:[1,[[0,&quot;易感环境包括高能量密度食物供应充足、含糖饮料和快餐易得、视屏时间长、久坐、体力活动不足、睡眠不足、家庭饮食模式和学校周边食物环境等。表现包括体重和 BMI 增加、腰围或体脂率增加，可伴血脂异常、血压升高、胰岛素抵抗、脂肪肝、睡眠呼吸问题和心理社会适应困难。&quot;]]],&quot;explanation&quot;:[0,&quot;分“环境”和“表现”两部分，环境再分食物、活动、睡眠和社会因素；表现兼顾体格、代谢和心理。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：24年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/BlGXCsyQJYDkDoDDqdTVVA&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2024&quot;]]],&quot;note&quot;:[0,&quot;公众号考试回忆版。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;medium&quot;],&quot;memoryAid&quot;:[0,&quot;肥胖环境包括高热量食物、含糖饮料、屏幕时间、久坐、缺觉，还有家庭和学校周边。表现不只看体重，腰围、代谢和心理也要看。&quot;]}],[0,{&quot;id&quot;:[0,&quot;past-2024-06&quot;],&quot;chapterKey&quot;:[0,&quot;ch01&quot;],&quot;chapter&quot;:[0,&quot;第一章 儿童少年生长发育&quot;],&quot;section&quot;:[0,&quot;可塑性&quot;],&quot;type&quot;:[0,&quot;short_answer&quot;],&quot;stem&quot;:[0,&quot;解释“生长发育可塑性”图示及其揭示的生长发育规律。&quot;],&quot;answer&quot;:[1,[[0,&quot;可塑性是指人体结构和功能为适应内外环境和生活经历而发生改变的能力。图示通常显示不同风险和保护因素下，儿童发展轨迹可能高于或低于潜能；保护因素、风险因素减少或敏感期干预可使轨迹回升，持续风险则使轨迹低于潜能。它说明生长发育既有遗传决定的轨迹，也能被环境和干预塑造，存在敏感期和累积效应。&quot;]]],&quot;explanation&quot;:[0,&quot;先定义，再读图（轨迹、风险/保护因素、敏感期），最后落到“可干预但有窗口期”。&quot;],&quot;sources&quot;:[1,[[0,{&quot;type&quot;:[0,&quot;past_exam&quot;],&quot;title&quot;:[0,&quot;Hmaide：24年儿童少年卫生学（预防）考试回忆&quot;],&quot;url&quot;:[0,&quot;https://mp.weixin.qq.com/s/BlGXCsyQJYDkDoDDqdTVVA&quot;]}]]],&quot;pastExam&quot;:[0,{&quot;years&quot;:[1,[[0,&quot;2024&quot;]]],&quot;note&quot;:[0,&quot;论述题，要求结合图示。&quot;]}],&quot;tags&quot;:[1,[]],&quot;difficulty&quot;:[0,&quot;advanced&quot;],&quot;memoryAid&quot;:[0,&quot;可塑性是轨迹能被环境和干预改变，但不是无限回弹。越早干预通常越有利，窗口过去后代价更大。&quot;]}]]]}" ssr client="load" opts="{&quot;name&quot;:&quot;WrongBook&quot;,&quot;value&quot;:true}" await-children><div class="wrong-loading">正在读取错题本...</div><!--astro:end--></astro-island></section></main><footer class="site-footer"><p>内容依据课程课件、指定教材和公开资料整理。个人理解部分会单独标注。</p><p>内容以课程课件和指定教材为准；本站不替代课堂学习。</p><div class="visit-stats" aria-label="阅读统计"><span id="busuanzi_container_page_pv" style="display:none">本文阅读 <strong id="busuanzi_page_pv">...</strong> 次</span><span id="busuanzi_container_site_pv" style="display:none">本站访问 <strong id="busuanzi_site_pv">...</strong> 次</span></div></footer><script src="https://busuanzi.9420.ltd/js"></script><script>
      (() => {
        const colors = {
          glass: "#2f6bff",
          night: "#0a1224",
          gold: "#0a0908",
          green: "#f3f6f4",
        };
        const choices = [...document.querySelectorAll("[data-theme-choice]")];
        const apply = (theme) => {
          document.documentElement.dataset.theme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", colors[theme] || colors.glass);
          }
          try {
            localStorage.setItem("cah.theme.v1", theme);
          } catch {}
          choices.forEach((button) => {
            button.setAttribute(
              "aria-pressed",
              String(button.dataset.themeChoice === theme),
            );
          });
        };
        choices.forEach((button) => {
          button.addEventListener("click", () => apply(button.dataset.themeChoice));
        });
        apply(document.documentElement.dataset.theme || "glass");
      })();
    </script></body></html>
